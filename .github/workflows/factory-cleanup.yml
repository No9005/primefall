# Software factory: deletes the head branch of a merged agent pull request
# (docs/agents/software-factory.md). Only branches `agent/*` of this repository are touched,
# and only when the repository variable FACTORY_ENABLED is "true". Runs trusted code from the
# default branch.
name: Factory cleanup

on:
  pull_request:
    types: [closed]

jobs:
  delete-branch:
    if: vars.FACTORY_ENABLED == 'true' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/factory/src/cli.ts delete-merged-branch "$PR"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
