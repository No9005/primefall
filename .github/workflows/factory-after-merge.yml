# Software factory, task "Next ticket" (docs/agents/software-factory.md).
# After an agent pull request is merged: closes the issues it names (if GitHub did not) and starts
# "Factory implement" for the next ticket. A close made with the workflow token starts no workflow,
# so the next ticket is started with an explicit workflow_dispatch. Does nothing unless the
# repository variable FACTORY_ENABLED is "true". Runs trusted code from the default branch.
name: Factory next ticket

on:
  pull_request:
    types: [closed]

concurrency:
  group: factory-next-ticket
  cancel-in-progress: false

jobs:
  next:
    if: vars.FACTORY_ENABLED == 'true' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: merged
        run: node tools/factory/src/cli.ts after-merge "$PR"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
      - name: Start the next ticket
        if: steps.merged.outputs.start == 'true'
        run: gh workflow run factory-implement.yml --repo "$REPO" --ref "$BRANCH" -f trigger=closed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
