# Software factory, task "Revive" (docs/agents/software-factory.md).
# Every 5 minutes: reads the state and restarts what the event chain dropped (a merge by the workflow
# token starts no workflow; a pull request with a conflict gets none either). It does nothing while a run
# is in progress and hands a pull request to a human after one restart. Does nothing unless the
# repository variable FACTORY_ENABLED is "true". Runs trusted code from the default branch.
name: Factory revive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print what would be restarted
        type: boolean
        default: false

# One revive run at a time; a newer one waits.
concurrency:
  group: factory-revive
  cancel-in-progress: false

jobs:
  revive:
    if: vars.FACTORY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the merge gate step can enable auto-merge
      pull-requests: write
      issues: write
      actions: write
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restart what is stuck
        run: node tools/factory/src/cli.ts revive ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMERGE_ENABLED: ${{ vars.AUTOMERGE_ENABLED }}
          BLAST_RADIUS_ENABLED: ${{ vars.BLAST_RADIUS_ENABLED }}
